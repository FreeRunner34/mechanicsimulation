name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Preflight project validation
        run: python3 scripts/validate_project.py

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Verify schemes and targets
        run: xcodebuild -list -project MasterMechanic.xcodeproj

      - name: Debug simulator build
        run: |
          xcodebuild \
            -project MasterMechanic.xcodeproj \
            -scheme MasterMechanic \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Release simulator build
        run: |
          xcodebuild \
            -project MasterMechanic.xcodeproj \
            -scheme MasterMechanic \
            -configuration Release \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Select an available iPhone simulator
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, subprocess
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          for runtime, devices in data["devices"].items():
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(f"SIMULATOR_UDID={device['udid']}")
                      print(f"SIMULATOR_NAME={device['name']}")
                      raise SystemExit
          raise SystemExit("No available iPhone simulator found")
          PY

      - name: Run unit tests
        run: |
          echo "Testing on $SIMULATOR_NAME ($SIMULATOR_UDID)"
          xcodebuild \
            -project MasterMechanic.xcodeproj \
            -scheme MasterMechanic \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            CODE_SIGNING_ALLOWED=NO \
            test
