name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Preflight project validation
        run: python3 scripts/validate_project.py

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Verify schemes and targets
        run: xcodebuild -list -project MasterMechanic.xcodeproj

      - name: Debug simulator build
        run: |
          xcodebuild \
            -project MasterMechanic.xcodeproj \
            -scheme MasterMechanic \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Release simulator build
        run: |
          xcodebuild \
            -project MasterMechanic.xcodeproj \
            -scheme MasterMechanic \
            -configuration Release \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            build

  unit-tests:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Select an available iPhone simulator
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, subprocess
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          for runtime, devices in data["devices"].items():
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(f"SIMULATOR_UDID={device['udid']}")
                      print(f"SIMULATOR_NAME={device['name']}")
                      raise SystemExit
          raise SystemExit("No available iPhone simulator found")
          PY

      - name: Boot test simulator
        run: |
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Run unit and local StoreKit tests
        run: |
          echo "Testing on $SIMULATOR_NAME ($SIMULATOR_UDID)"
          xcodebuild \
            -project MasterMechanic.xcodeproj \
            -scheme MasterMechanic \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            test
