name: Install MasterMechanic app icon

on:
  push:
    paths:
      - ".iconpayload/READY"

permissions:
  contents: write

jobs:
  install-icon:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild app icon
        shell: bash
        run: |
          set -euo pipefail
          cat .iconpayload/chunk_*.txt | base64 --decode > /tmp/mastermechanic-icon.jpg
          sips -s format png /tmp/mastermechanic-icon.jpg --out MasterMechanic/Assets.xcassets/AppIcon.appiconset/AppIcon.png >/dev/null
          test "$(sips -g pixelWidth MasterMechanic/Assets.xcassets/AppIcon.appiconset/AppIcon.png | awk '/pixelWidth/{print $2}')" = "1024"
          test "$(sips -g pixelHeight MasterMechanic/Assets.xcassets/AppIcon.appiconset/AppIcon.png | awk '/pixelHeight/{print $2}')" = "1024"
      - name: Commit icon and clean payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MasterMechanic/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          git rm -r .iconpayload .github/workflows/install-mastermechanic-icon.yml
          git commit -m "Add final MasterMechanic app icon"
          git push
