name: Pre-Apple Hardening Refactor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/preapple-refactor.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply pre-Apple refactor
        run: python3 scripts/preapple_refactor.py
      - name: Commit hardened project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Harden app before Apple Developer setup"
          git push origin HEAD:main
