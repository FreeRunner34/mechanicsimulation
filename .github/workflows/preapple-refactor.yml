name: Pre-Apple Hardening Refactor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/preapple-refactor.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix missing inspection tool
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('MasterMechanic/Models.swift')
          text = path.read_text()
          old = 'id: "senior-fuel-pump-control",\n                difficulty: .senior,\n                brand: "Kestrel Automotive",\n                repairOrder: .init(vehicle: "2021 Kestrel Vector Turbo", mileage: 59200, complaint: "Long crank occurs only after a hot soak; cold starts are always normal.", notes: "No current DTCs."),\n                tools: [tool("scan_tool"), tool("pressure_gauge"), tool("multimeter"), tool("test_drive")],'
          new = 'id: "senior-fuel-pump-control",\n                difficulty: .senior,\n                brand: "Kestrel Automotive",\n                repairOrder: .init(vehicle: "2021 Kestrel Vector Turbo", mileage: 59200, complaint: "Long crank occurs only after a hot soak; cold starts are always normal.", notes: "No current DTCs."),\n                tools: [tool("scan_tool"), tool("pressure_gauge"), tool("multimeter"), tool("flashlight"), tool("test_drive")],'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one senior fuel-pump case, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit repair-order integrity fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MasterMechanic/Models.swift
          git commit -m "Fix missing tool in senior diagnostic case"
          git push origin HEAD:main
